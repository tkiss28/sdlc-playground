apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maven-cache
  labels:
    app.kubernetes.io/part-of: sdlc-playground
spec:
  # RWO is fine: only the maven-build task mounts it, one PipelineRun at a time.
  # Concurrent runs will serialize on this claim (acceptable for the PoC).
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
