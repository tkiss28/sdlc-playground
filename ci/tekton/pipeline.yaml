apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: petclinic-build
  labels:
    app.kubernetes.io/part-of: sdlc-playground
spec:
  description: >-
    Phase-1 supply-chain pipeline: clone -> maven verify (resolving aspectjweaver
    from Red Hat Lightwell) -> verify RHLN artifact SLSA provenance (Cosign gate)
    -> build & push image -> attach CycloneDX SBOM attestation. Tekton Chains then
    signs the image and records SLSA provenance out-of-band, keyed off the
    IMAGE_URL/IMAGE_DIGEST results below.
  params:
    - name: git-url
      type: string
      description: The spring-petclinic fork URL.
    - name: git-revision
      type: string
      default: main
    - name: image
      type: string
      description: Target image (tag). Chains signs the pushed digest.
    - name: tls-verify
      type: string
      description: Set to "false" for the CRC internal-registry route (insecure).
      default: "true"
    - name: source-subdir
      type: string
      description: >-
        Subdirectory of the shared workspace the project is cloned into. Keeps the
        project (nohttp scan root) separate from the sibling .m2 cache.
      default: app
  workspaces:
    - name: shared
      description: >-
        Persistent workspace PVC shared across tasks. Holds the cloned project in
        the `app/` subdir and the .m2 cache at its root (/workspace/source/.m2),
        so the cache survives between runs and stays outside the nohttp scan root.
    - name: maven-settings
      description: ConfigMap workspace carrying the Lightwell settings.xml.
  results:
    - name: IMAGE_URL
      value: $(tasks.build-image.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image.results.IMAGE_DIGEST)
    - name: CHAINS-GIT_URL
      value: $(tasks.fetch-source.results.url)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.fetch-source.results.commit)
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: subdirectory
          value: $(params.source-subdir)
      workspaces:
        - name: source
          workspace: shared

    - name: maven-build
      runAfter: ["fetch-source"]
      taskRef:
        name: maven-build
      params:
        - name: subdirectory
          value: $(params.source-subdir)
      workspaces:
        - name: source
          workspace: shared
        - name: maven-settings
          workspace: maven-settings

    - name: provenance-verify
      runAfter: ["maven-build"]
      taskRef:
        name: provenance-verify
      # Uses the task's default `artifacts` list (the representative validated
      # set). The PNC public key is supplied via the `pnc-provenance-key`
      # ConfigMap referenced inside the task's volumes — no extra workspace needed.
      workspaces:
        - name: source
          workspace: shared

    - name: build-image
      # Gated: a failing provenance-verify blocks the image build.
      runAfter: ["provenance-verify"]
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: $(params.image)
        - name: TLSVERIFY
          value: $(params.tls-verify)
        - name: CONTEXT
          value: $(params.source-subdir)
      workspaces:
        - name: source
          workspace: shared

    - name: sbom-attest
      runAfter: ["build-image"]
      taskRef:
        name: sbom-attest
      params:
        - name: IMAGE
          value: $(params.image)
        - name: IMAGE_DIGEST
          value: $(tasks.build-image.results.IMAGE_DIGEST)
        - name: SBOM_PATH
          value: $(tasks.maven-build.results.sbom-path)
        - name: TLSVERIFY
          value: $(params.tls-verify)
      workspaces:
        - name: source
          workspace: shared
