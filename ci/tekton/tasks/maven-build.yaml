apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-build
  labels:
    app.kubernetes.io/part-of: sdlc-playground
spec:
  description: >-
    Authoritative Maven build. Runs `mvn verify` with the Lightwell settings.xml
    so that org.aspectj:* resolves from the Red Hat Lightwell repository, runs the
    tests, and produces both the Spring Boot fat jar and the CycloneDX SBOM
    (target/bom.json via the cyclonedx-maven-plugin already configured in pom.xml).
  params:
    - name: subdirectory
      type: string
      description: Path within the source workspace that holds pom.xml.
      default: ""
    - name: goals
      type: string
      description: Maven goals/flags to run.
      default: "-B -DskipTests=false clean verify"
  workspaces:
    - name: source
      description: >-
        Persistent workspace PVC. The project is cloned into the `app/`
        subdirectory (the nohttp scan root) while the .m2 cache lives at
        /workspace/source/.m2/repository — a SIBLING of app/, so it is outside
        ${basedir} and nohttp-checkstyle does not walk the dependency POMs.
    - name: maven-settings
      description: ConfigMap-backed workspace providing settings.xml.
  results:
    - name: sbom-path
      description: Workspace-relative path to the generated CycloneDX SBOM.
  steps:
    - name: build
      image: registry.access.redhat.com/ubi9/openjdk-17:latest
      workingDir: $(workspaces.source.path)/$(params.subdirectory)
      # Credentials for the Lightwell <server> come from the Secret
      # redhat-lightwell-creds and are expanded by Maven via ${env.VAR} in
      # settings.xml. They never touch the ConfigMap.
      env:
        - name: RH_LIGHTWELL_USER
          valueFrom:
            secretKeyRef:
              name: redhat-lightwell-creds
              key: username
        - name: RH_LIGHTWELL_TOKEN
          valueFrom:
            secretKeyRef:
              name: redhat-lightwell-creds
              key: token
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # Use the Maven bundled in the ubi9/openjdk-17 builder image rather than
        # ./mvnw: the wrapper downloads apache-maven as a .tar.gz, and this image
        # has no gzip (and the step runs as a non-root UID that cannot install it).
        #
        # -Daether.connector.http.preemptiveAuth=true : Lightwell answers anonymous
        # requests with HTTP 403 (not 401), so Maven's default *reactive* auth never
        # gets a challenge and silently falls back to Maven Central for EVERY
        # artifact. Forcing preemptive Basic auth makes validated coordinates
        # actually resolve from lightwell-validated.
        # Fail fast on missing/expired/wrong Lightwell credentials. Without this,
        # Maven does NOT error on bad auth — it silently falls back to Maven
        # Central, defeating the validated-source guarantee. Probe a known
        # validated artifact and require HTTP 200 before building.
        PROBE="https://packages.redhat.com/lightwell/java/validated/org/springframework/spring-aop/7.0.8/spring-aop-7.0.8.pom"
        CODE="$(curl -s -o /dev/null -w '%{http_code}' -u "${RH_LIGHTWELL_USER}:${RH_LIGHTWELL_TOKEN}" "${PROBE}" || echo 000)"
        if [ "${CODE}" != "200" ]; then
          echo "ERROR: Lightwell auth probe failed (HTTP ${CODE}) as user '${RH_LIGHTWELL_USER}'." >&2
          echo "       Check RH_LIGHTWELL_USER / RH_LIGHTWELL_TOKEN (unset? expired token? wrong account?)." >&2
          exit 1
        fi
        echo "Lightwell auth probe OK (HTTP 200) — validated artifacts will resolve from Lightwell."

        mvn -s "$(workspaces.maven-settings.path)/settings.xml" \
            -Daether.connector.http.preemptiveAuth=true \
            $(params.goals)

        # Record where the SBOM landed for the downstream attest step. Don't assume
        # target/bom.json: Spring Boot's cyclonedx config writes it to the classpath
        # (target/classes/META-INF/sbom/application.cdx.json) so Actuator can serve
        # it. Locate it instead, and emit a path relative to the workspace root
        # (sbom-attest's workingDir).
        SBOM_ABS="$(find "$(pwd)/target" \( -name 'application.cdx.json' -o -name 'bom.json' \) 2>/dev/null | head -1)"
        if [ -z "${SBOM_ABS}" ]; then
          echo "ERROR: no CycloneDX SBOM found under $(pwd)/target" >&2
          exit 1
        fi
        SBOM="${SBOM_ABS#$(workspaces.source.path)/}"
        echo "SBOM recorded at: ${SBOM}"
        printf '%s' "${SBOM}" > "$(results.sbom-path.path)"

        echo "=== Proof: where did aspectjweaver come from? ==="
        find "$(workspaces.source.path)" -path '*org/aspectj/aspectjweaver/1.9.25.1/_remote.repositories' \
          -exec cat {} \; || echo "(_remote.repositories not found — check settings.xml lightwell-validated repository)"
