apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  labels:
    app.kubernetes.io/part-of: sdlc-playground
spec:
  description: >-
    Minimal, self-contained git clone (no external task bundles). Clones the app
    repo into the `source` workspace and emits the url/commit results that Tekton
    Chains consumes for provenance.
  params:
    - name: url
      type: string
      description: Repository URL to clone (the spring-petclinic fork).
    - name: revision
      type: string
      description: Branch, tag or SHA to check out.
      default: main
    - name: subdirectory
      type: string
      description: Subdirectory inside the workspace to clone into.
      default: ""
  workspaces:
    - name: source
      description: Where the repo is cloned.
  results:
    - name: commit
      description: The precise commit SHA that was checked out.
    - name: url
      description: The repository URL that was cloned.
  steps:
    - name: clone
      image: registry.access.redhat.com/ubi9/toolbox:latest
      workingDir: $(workspaces.source.path)
      env:
        # OpenShift runs this step as an arbitrary non-root UID, so HOME=/ is not
        # writable. Point HOME at a writable dir so git config / cred copy work.
        - name: HOME
          value: /tekton/home
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        SUBDIR="$(params.subdirectory)"
        # A subdirectory is required: the workspace PVC is persistent and also
        # holds the sibling .m2 cache at its root, so we must confine the checkout
        # (and the clean-slate wipe below) to a subdir and never the workspace root.
        if [ -z "${SUBDIR}" ]; then
          echo "ERROR: git-clone requires a non-empty subdirectory param" >&2
          exit 1
        fi
        TARGET="$(workspaces.source.path)/${SUBDIR}"
        # Fresh checkout every run (reproducibility) without disturbing the
        # persisted .m2 cache that lives beside this dir.
        rm -rf "${TARGET}"
        mkdir -p "${TARGET}"
        cd "${TARGET}"
        # The workspace dir is owned by a different UID than this step runs as;
        # tell git it is safe so the arbitrary-UID checkout is not rejected.
        git config --global --add safe.directory "${TARGET}"
        git init -q
        git remote add origin "$(params.url)"
        git fetch -q --depth 1 origin "$(params.revision)"
        git checkout -q FETCH_HEAD
        RESOLVED="$(git rev-parse HEAD)"
        printf '%s' "${RESOLVED}" > "$(results.commit.path)"
        printf '%s' "$(params.url)" > "$(results.url.path)"
        echo "Checked out $(params.url)@${RESOLVED}"
