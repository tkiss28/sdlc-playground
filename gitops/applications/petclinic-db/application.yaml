apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic-db
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: sdlc-playground
spec:
  project: default
  source:
    # EDIT: point at YOUR sdlc-playground fork.
    repoURL: https://github.com/tkiss28/sdlc-playground.git
    targetRevision: HEAD
    path: gitops/base/db/
  destination:
    namespace: petclinic
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 50
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
