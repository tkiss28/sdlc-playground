apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: sdlc-playground
spec:
  project: default
  source:
    # EDIT: point at YOUR sdlc-playground fork.
    repoURL: https://github.com/tkiss28/sdlc-playground.git
    targetRevision: HEAD
    # CRC overlay pins the image by digest and sets the Route host. The overlay
    # also carries the PreSync cosign-verify Job that gates this app's rollout.
    path: overlays/openshift-local/
  destination:
    namespace: petclinic
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 50
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
